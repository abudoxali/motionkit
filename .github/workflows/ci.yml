name: Developer Tool CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install FFmpeg (media tests require decoded opacity and voiceover probes)
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm run doctor
      - run: npm run validate
      - run: npm run projects:validate
      - run: npm run skills:sync -- --check
      - run: npm run release:package
      - name: Verify package checksum
        shell: bash
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS.txt

  browser:
    name: Browser QA (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
